# ---------------------------------------------------------------------------
# PHP, tuned for what this application does
# ---------------------------------------------------------------------------
# Written to a file of its own so that the configuration shipped with the image
# is left alone.

; A track is proxied in chunks rather than read into memory, but the worker
; stays alive for the whole of it: a limit on execution time would cut a long
; track off in the middle.
max_execution_time = 0

; Nothing large is ever held in memory: the audio is copied through in 64 KB
; chunks. This is a guard against a mistake elsewhere, not a working size.
memory_limit = 256M

; Nothing is uploaded. These are the defaults of the image, restated so that
; the reason they are safe is written down.
post_max_size = 8M
upload_max_filesize = 8M

; The version of PHP has no business being announced.
expose_php = Off

; Errors are reported to the log, never to the device: a trace would end up in
; the answer given to the console.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000